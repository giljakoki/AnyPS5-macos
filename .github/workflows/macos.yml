name: macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A build takes long; a newer run waits for the running one instead of discarding its results.
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test (x86-64 under Rosetta)
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Rosetta, Ninja and the guest toolchain
        run: |
          if ! /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          /usr/bin/arch -x86_64 /usr/bin/true
          command -v ninja >/dev/null || brew install ninja
          # LLVM and lld build the guest test programs and the Breakout demo (relinker/tests/macos/guesttools.py).
          brew install llvm lld
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "ANYPS5_LLVM_BIN=$(brew --prefix llvm)/bin" >> "$GITHUB_ENV"
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: macos-x86_64
          save: true
          evict-old-files: job
      # Line tables let a failing test's backtrace name file and line; -S keeps them out of the libraries.
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_C_FLAGS=-gline-tables-only -DCMAKE_CXX_FLAGS=-gline-tables-only
          -DCMAKE_SHARED_LINKER_FLAGS=-Wl,-S -DCMAKE_MODULE_LINKER_FLAGS=-Wl,-S
      # -k 0 keeps going after a failure, so one run reports every file that does not build; on a failure the
      # diagnostics are repeated at the end of the log, where a long build would otherwise bury them.
      - name: Build
        run: |
          set -o pipefail
          cmake --build build -- -k 0 2>&1 | tee build.log && exit 0
          echo "===== build errors ====="
          grep -E -A8 'error:|FAILED:|Undefined symbols|duplicate symbol|^ld: ' build.log | grep -v -E '^\[[0-9]+/[0-9]+\] |^ld: warning: ' | head -n 2000
          exit 1
      - name: Build the system libraries
        id: libs
        run: |
          set -o pipefail
          cmake --build build --target libs -- -k 0 2>&1 | tee libs.log && exit 0
          echo "===== build errors ====="
          grep -E -A8 'error:|FAILED:|Undefined symbols|duplicate symbol|^ld: ' libs.log | grep -v -E '^\[[0-9]+/[0-9]+\] |^ld: warning: ' | head -n 2000
          exit 1
      # No Vulkan loader is installed yet, so the GPU tests skip. Tests that open windows stay out, as BUILD.md asks.
      - name: Test
        timeout-minutes: 40
        run: |
          touch "$RUNNER_TEMP/tests-started"
          ctest --test-dir build --output-on-failure --timeout 120 --parallel 3 \
            --output-log ctest.log --output-junit ctest.xml -E 'agc_driver_lds_atomics64|flip|display' && exit 0
          echo "===== failed tests, run again one at a time ====="
          bash .github/scripts/diagnose_failed_tests.sh build "$RUNNER_TEMP/tests-started" || true
          exit 1
      - name: Report tests slower than 30 s
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          [ -f ctest.log ] || exit 0
          awk '/Test +#[0-9]+: / && $NF == "sec" { for (i = 1; i <= NF; i++) if ($i ~ /^#[0-9]+:$/) name = $(i + 1); t = $(NF - 1) + 0; if (t > max[name]) max[name] = t }
            END { for (name in max) if (max[name] > 30) printf "::warning title=Slow test::%s took %.1f s on macOS\n", name, max[name] }' ctest.log
      # The Vulkan loader and MoltenVK for the package and the demo; installed after the tests so they keep skipping the GPU.
      - name: Install the Vulkan SDK
        id: vulkan
        if: ${{ !cancelled() && steps.libs.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/vulkan"
          mkdir -p "$work"
          if curl -fsSL -o "$work/sdk.zip" https://sdk.lunarg.com/sdk/download/latest/mac/vulkan_sdk.zip; then
            unzip -q "$work/sdk.zip" -d "$work/unpacked"
            source="$work/unpacked"
          else
            curl -fsSL -o "$work/sdk.dmg" https://sdk.lunarg.com/sdk/download/latest/mac/vulkan_sdk.dmg
            hdiutil attach -nobrowse -readonly -mountpoint "$work/mount" "$work/sdk.dmg"
            source="$work/mount"
          fi
          app=$(find "$source" -maxdepth 2 -name '*.app' -type d | head -n 1)
          installer=$(find "$app/Contents/MacOS" -maxdepth 1 -type f -perm -u+x | head -n 1)
          sudo "$installer" --root "$work/sdk" --accept-licenses --default-answer --confirm-command install
          moltenvk=$(find "$work/sdk" -path '*/macOS/lib/libMoltenVK.dylib' | head -n 1)
          sdk=$(cd "$(dirname "$moltenvk")/.." && pwd)
          ls -l "$sdk/lib/libvulkan.1.dylib" "$sdk/share/vulkan/icd.d/MoltenVK_icd.json"
          for library in "$sdk/lib/libvulkan.1.dylib" "$moltenvk"; do
            lipo -archs "$library"
            lipo -archs "$library" | grep -qw x86_64
          done
          echo "dir=$sdk" >> "$GITHUB_OUTPUT"
      - name: Package
        if: ${{ !cancelled() && steps.libs.outcome == 'success' }}
        env:
          VULKAN_SDK_DIR: ${{ steps.vulkan.outputs.dir }}
        run: |
          set -euo pipefail
          out=dist/anyps5-macos-x86_64
          mkdir -p "$out/libs" "$out/docs"
          cp build/core/relinker/relinker "$out/"
          cp build/core/libs/libs/*.prx "$out/libs/"
          cp tools/package_macos_app.py "$out/"
          cp docs/user/MACOS.md docs/user/USAGE.md docs/user/INPUT_MAPPING.md docs/user/COMPATIBILITY.md "$out/docs/"
          if [ -n "$VULKAN_SDK_DIR" ]; then
            mkdir -p "$out/vulkan/lib" "$out/vulkan/share/vulkan/icd.d" "$out/vulkan/licenses"
            cp -L "$VULKAN_SDK_DIR/lib/libvulkan.1.dylib" "$VULKAN_SDK_DIR/lib/libMoltenVK.dylib" "$out/vulkan/lib/"
            cp "$VULKAN_SDK_DIR/share/vulkan/icd.d/MoltenVK_icd.json" "$out/vulkan/share/vulkan/icd.d/"
            find "$(dirname "$VULKAN_SDK_DIR")" -maxdepth 3 -iname '*licen[cs]e*' -type f -exec cp {} "$out/vulkan/licenses/" \; || true
            printf '%s\n' "libvulkan.1.dylib (Khronos Vulkan-Loader) and libMoltenVK.dylib (KhronosGroup/MoltenVK) from the LunarG Vulkan SDK, both under the Apache License 2.0." > "$out/vulkan/README.txt"
          fi
          git rev-parse HEAD > "$out/COMMIT"
          file "$out/relinker" "$out/libs/libkernel.prx"
          tar -czf dist/anyps5-macos-x86_64.tar.gz -C dist anyps5-macos-x86_64
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.libs.outcome == 'success' }}
        with:
          name: anyps5-macos-x86_64
          path: dist/anyps5-macos-x86_64.tar.gz
          retention-days: 30
      # Breakout (relinker/tests/macos/breakout.cpp) is a small homebrew title: relinked and packaged like a game.
      - name: Build the Breakout demo
        id: demo
        if: ${{ !cancelled() && steps.vulkan.outputs.dir != '' }}
        continue-on-error: true
        env:
          VULKAN_SDK_DIR: ${{ steps.vulkan.outputs.dir }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/breakout"
          mkdir -p "$work/source" "$work/input" "$work/relinked"
          python3 - "$work/source" <<'EOF'
          import pathlib, sys
          here = pathlib.Path("core/relinker/relinker/tests/macos").resolve()
          sys.path[:0] = [str(here), str(here.parent)]
          import run_macos_fixtures
          run_macos_fixtures.compiled_breakout(pathlib.Path(sys.argv[1]))
          EOF
          cp "$work/source/eboot.elf" "$work/input/"
          build/core/relinker/relinker --macos --to-rosetta --skip-sce-module "$work/input/eboot.elf" "$work/relinked/eboot"
          python3 tools/package_macos_app.py --relinked "$work/relinked" --game "$work/source/app0" --libs build/core/libs/libs \
            --vulkan "$VULKAN_SDK_DIR" --input-config "$work/source/anyps5-input.ini" "dist/AnyPS5 Breakout.app"
          ditto -c -k --keepParent "dist/AnyPS5 Breakout.app" dist/AnyPS5-Breakout.zip
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.demo.outcome == 'success' }}
        with:
          name: anyps5-breakout-demo
          path: dist/AnyPS5-Breakout.zip
          retention-days: 30

  report:
    needs: build
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RESULT: ${{ needs.build.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or close the macos-build issue
        run: |
          set -euo pipefail
          gh label create macos-build --repo "$GITHUB_REPOSITORY" --color B60205 --description "The macOS build or tests fail on the default branch" 2>/dev/null || true
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --label macos-build --state open --json number --jq '.[0].number // empty')
          if [ "$RESULT" = "success" ]; then
            if [ -n "$issue" ]; then gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Fixed: $RUN_URL passed at $GITHUB_SHA."; fi
          elif [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "Still failing at $GITHUB_SHA: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label macos-build --title "macOS build fails on $GITHUB_REF_NAME" \
              --body "The macOS build or tests failed at $GITHUB_SHA: $RUN_URL"
          fi
